extends: default.yaml

project:
  mode: genome_evolution_protocol_template
  protocol_status: calibrate_then_freeze_before_final_runs

evolution:
  genome_only_mode: true
  max_generations: 50
  convergence:
    enabled: false

# Fill/freeze after the 5 -> 20 -> 30 -> 50 generation calibration protocol.
# Nulls are deliberate: do not use this template until calibrated.
genome_evolution:
  attempt_budget:
    mode: active_population
    multiplier: null
    minimum: 1
    maximum: null
  operator_weights:
    mutation: null
    crossover: null
    fusion: null
    defusion: null
    composition: null
    decomposition: null
  composition_parent_count: 2
  fusion_binary_operators: [AND, OR, XOR, NAND]

coverage:
  report_thresholds: [1, 2, 3, 5]

content:
  enabled: false

outputs:
  root: outputs/evolution
