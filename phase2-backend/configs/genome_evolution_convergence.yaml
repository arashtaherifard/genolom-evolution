extends: genome_evolution_development.yaml

project:
  mode: genome_evolution_convergence_m7_1
  protocol_status: development_convergence_diagnostic_not_final_results

# M7.1 keeps the exact M7 genetic dynamics and changes only the stopping logic.
evolution:
  # G50 did not satisfy the frozen criterion, so use a higher safety ceiling.
  # The run stops earlier if convergence is detected.
  max_generations: 100
  convergence:
    enabled: true
    stop_on_convergence: true

    # FROZEN M7.1 criterion (OUR_OPERATIONALIZATION).
    minimum_generation: 10
    window_generations: 5
    mean_micro_fitness_range_max: 0.01
    population_relative_range_max: 0.05
    unique_genome_ratio_range_max: 0.02
    recall_range_max: 0.02
