extends: development.yaml

project:
  mode: genome_evolution_development
  protocol_status: development_only_genome_evolution_not_final_results

evolution:
  genome_only_mode: true
  max_generations: 50
  convergence:
    enabled: false

# Automatic operator scheduling is OUR operationalization and remains
# configurable. These are development/smoke values, not final paper values.
genome_evolution:
  attempt_budget:
    mode: active_population
    multiplier: 1.0
    minimum: 1
    maximum: 1000
  operator_weights:
    mutation: 0.35
    crossover: 0.35
    fusion: 0.10
    defusion: 0.05
    composition: 0.10
    decomposition: 0.05
  composition_parent_count: 2
  fusion_binary_operators: [AND, OR, XOR, NAND]

coverage:
  # @1 is identical to Recall/CoverageSpan by definition and serves as a
  # consistency check. @2/@3/@5 quantify repeated resource coverage.
  report_thresholds: [1, 2, 3, 5]

content:
  enabled: false

outputs:
  root: outputs/evolution
