[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "genolom-evolution-phase2"
version = "0.2.0"
description = "Research-grade Phase 2 backend for GenoLOM Evolution"
requires-python = ">=3.12"
dependencies = [
  "openpyxl>=3.1,<4",
  "PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
